<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AXIPLAT — High Accuracy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #0b0c10;
        color: #f4f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .wrap {
        width: 100%;
        max-width: 720px;
        padding: 24px;
        background: #14171f;
        border-radius: 16px;
        border: 1px solid #1f2230;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        text-align: center;
    }
    h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
    }
    p {
        margin: 0 0 20px;
        color: #9ea7c6;
        font-size: 0.95rem;
    }
    #video {
        width: 100%;
        border-radius: 12px;
        background: #000;
        border: 1px solid #1f2230;
    }
    .live-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
        font-size: 0.9rem;
    }
    .face-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 12px;
        border-radius: 999px;
        background: #1f2230;
        color: #9ea7c6;
        white-space: nowrap;
    }
    .face-chip .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #555c77;
        flex: none;
    }
    .face-chip.on { color: #9fe6b0; }
    .face-chip.on .dot { background: #37c46b; }
    .countdown { color: #8ac6f2; white-space: nowrap; }
    .progress-wrap { margin-top: 12px; text-align: left; }
    .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: #9ea7c6;
        margin-bottom: 6px;
    }
    .progress-track {
        height: 8px;
        border-radius: 999px;
        background: #1f2230;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2f7bd4, #37c46b);
        transition: width 0.4s ease;
    }
    #info {
        margin-top: 18px;
        font-size: 1.2rem;
        font-weight: 500;
    }
    #detail {
        margin-top: 6px;
        color: #a8b2d9;
        min-height: 1.2em;
        font-size: 0.9rem;
    }
    .result-card {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #1a1e2a;
        border: 1px solid #262b3d;
        display: none;
        text-align: left;
    }
    .result-card.show { display: block; }
    .result-card .row {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        padding: 4px 0;
    }
    .result-card .row .k { color: #9ea7c6; }
    .result-card.granted { border-color: #2c5a3c; }
    .result-card.denied { border-color: #5a2c2c; }
    .status {
        display: inline-block;
        margin-top: 14px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: #1f2230;
        color: #8ac6f2;
    }
    .status.error { color: #ff9f9f; }
    .status.ok { color: #9fe6b0; }
</style>
</head>
<body>
<div class="wrap">
    <span class="status" id="status-pill">Initializing</span>
    <h1>Age Check</h1>
    <p>Please face the camera head-on. Lighting should be even.</p>
    <img id="video" src="/video_feed" alt="Live camera stream">
    <div class="live-row">
        <span class="face-chip" id="face-chip"><span class="dot"></span><span id="face-text">No face yet</span></span>
        <span class="countdown" id="countdown"></span>
    </div>
    <div class="progress-wrap">
        <div class="progress-label">
            <span>Good samples collected</span>
            <span id="progress-text">0 / 6</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div id="info">Preparing camera…</div>
    <div id="detail"></div>
    <div class="result-card" id="result-card">
        <div class="row"><span class="k">Estimated age</span><span id="res-age">—</span></div>
        <div class="row"><span class="k">Age group</span><span id="res-group">—</span></div>
        <div class="row"><span class="k">Required minimum</span><span id="res-threshold">—</span></div>
        <div class="row"><span class="k">Decision</span><span id="res-decision">—</span></div>
    </div>
</div>

<script>
const info = document.getElementById('info');
const detail = document.getElementById('detail');
const pill = document.getElementById('status-pill');
const faceChip = document.getElementById('face-chip');
const faceText = document.getElementById('face-text');
const countdown = document.getElementById('countdown');
const progressText = document.getElementById('progress-text');
const progressFill = document.getElementById('progress-fill');
const resultCard = document.getElementById('result-card');

let polling = true;
let lastSessionId = null;

function setPill(kind, text) {
    pill.textContent = text;
    pill.classList.toggle('error', kind === 'error');
    pill.classList.toggle('ok', kind === 'ok');
}

function updateLive(j) {
    const on = Boolean(j.face_detected);
    faceChip.classList.toggle('on', on);
    faceText.textContent = on ? 'Face detected' : 'No face — look at the camera';

    const need = j.samples_needed || 6;
    const have = j.valid_samples || 0;
    progressText.textContent = `${Math.min(have, need)} / ${need}`;
    progressFill.style.width = `${Math.min(have / need, 1) * 100}%`;

    if (j.stream_active && j.elapsed !== null && j.max_seconds) {
        const left = Math.max(0, Math.ceil(j.max_seconds - j.elapsed));
        countdown.textContent = `${left}s remaining`;
    }
}

function showResult(j) {    resultCard.classList.add('show');
    resultCard.classList.add(j.access_allowed ? 'granted' : 'denied');
    document.getElementById('res-age').textContent =
        j.final_median_age !== null ? `${j.final_median_age.toFixed(1)} yrs` : 'not determined';
    document.getElementById('res-group').textContent = j.final_group || '—';
    document.getElementById('res-threshold').textContent =
        j.threshold !== undefined ? `${j.threshold} yrs` : '14 yrs';
    document.getElementById('res-decision').textContent = j.access_allowed ? 'Granted' : 'Denied';
}

async function pollStatus() {
    try {
        const r = await fetch('/status');
        const j = await r.json();
        if (j.session_id) lastSessionId = j.session_id;

        if (j.camera_error) {
            setPill('error', 'Camera Error');
            info.textContent = 'Camera unavailable';
            detail.textContent = j.camera_error + '. Please confirm it is plugged in and not used by other apps.';
            countdown.textContent = '';
            polling = false;
            return;
        }

        updateLive(j);

        if (j.ema && j.ema > 0) {
            setPill('', 'Detecting');
            info.textContent = `Live estimate: ${j.ema.toFixed(1)} years`;
            detail.textContent = 'Hold steady for a few more seconds for a final result.';
        } else if (j.stream_active) {
            setPill('', 'Detecting');
            info.textContent = 'Detecting…';
            detail.textContent = 'Ensure your whole face is visible, close enough, and facing the camera.';
        }

        if (!j.stream_active) {
            countdown.textContent = '';
            showResult(j);
            if (j.final_median_age !== null && j.final_group) {
                const ageText = `${j.final_median_age.toFixed(1)} yrs · ${j.final_group}`;
                if (j.access_allowed) {
                    info.textContent = 'Access granted';
                    detail.textContent = `${ageText}. Redirecting you now…`;
                    setPill('ok', 'Approved');
                    const sid = lastSessionId ? `?sid=${encodeURIComponent(lastSessionId)}` : '';
                    setTimeout(() => window.location.replace(`/insta${sid}`), 600);
                } else {
                    info.textContent = 'Access denied';
                    detail.textContent = `${ageText}. You must be at least ${j.threshold !== undefined ? j.threshold : 14} years old.`;
                    setPill('error', 'Denied');
                    setTimeout(() => {
                        window.location.replace("/passcode");
                    }, 2000);
                }
            } else {
                info.textContent = 'Could not determine age';
                detail.textContent = j.camera_error || 'Try adjusting lighting, moving closer, and keeping your face in frame.';
                setPill('error', 'No Signal');
                // Allow a fresh attempt instead of stranding the user
                setTimeout(() => window.location.reload(), 3500);
            }
            polling = false;
            return;
        }
    } catch (e) {
        console.error(e);
    }

    if (polling) setTimeout(pollStatus, 600);
}

pollStatus();
</script>
</body>
</html>
